# Lint + offline test suite on every push and pull request.
# The tests use a scripted fake LLM: no Ollama, no models, no Docker needed (live tests are excluded by
# default with `-m 'not live'` in pyproject.toml). Windows runs too, since the project must work there.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

# Only the latest commit of a branch is tested: a new push cancels the run still in progress (and replaces any
# queued one).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (locked)
        run: uv sync --frozen
      - name: ruff check
        run: uv run ruff check . --output-format=github

  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies (locked, Python from pyproject)
        run: uv sync --frozen
      - name: pytest (offline, fake LLM)
        run: uv run pytest -q

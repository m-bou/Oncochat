<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OncoChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true">
        <circle cx="12" cy="12" r="10" fill="var(--hema)"/>
        <circle cx="9" cy="10" r="2.6" fill="var(--eosin)"/>
        <circle cx="15" cy="14.5" r="1.8" fill="var(--eosin)" opacity=".75"/>
      </svg>
      <span>OncoChat</span>
    </div>
    <button class="new-chat" id="newChat" type="button">New chat</button>
    <nav class="conversations" id="conversations" aria-label="Conversations"></nav>
    <div class="sidebar-foot">
      <button class="foot-btn" id="openActivity" type="button">Activity</button>
      <button class="foot-btn" id="toggleTheme" type="button">Dark mode</button>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <button class="icon-btn" id="toggleSidebar" type="button" aria-label="Toggle sidebar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <span class="health" id="health" title="Model status"></span>
    </header>

    <section class="thread" id="thread" aria-live="polite"></section>

    <section class="hero" id="hero">
      <h1>What would you like to know about the data?</h1>
      <p class="hero-sub" id="heroSub">Ask about genes and their expression across cancer indications.</p>
    </section>

    <form class="composer" id="composer">
      <label class="sr-only" for="input">Your question</label>
      <textarea id="input" rows="1" placeholder="Ask a question, e.g. which genes are involved in lung cancer?"
                autocomplete="off"></textarea>
      <div class="composer-bar">
        <span class="composer-hint">Enter to send, Shift+Enter for a new line</span>
        <button class="send" id="send" type="submit" aria-label="Send question">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg>
        </button>
      </div>
    </form>

    <div class="suggestions" id="suggestions">
      <button type="button">How can you help me?</button>
      <button type="button">What are the main genes involved in lung cancer?</button>
      <button type="button">What is the median value expression of genes involved in breast cancer?</button>
      <button type="button">What is the median value expression of genes involved in esophageal cancer?</button>
    </div>
  </main>

  <aside class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-head">
      <h2 id="drawerTitle">Trace</h2>
      <button class="icon-btn" id="closeDrawer" type="button" aria-label="Close panel">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>
</div>
<script src="/static/app.js"></script>
</body>
</html>

# One command for reviewers:  docker compose up --build   →  http://localhost:8000
# The same file backs the VS Code devcontainer (see .devcontainer/).
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_KEEP_ALIVE: 30m          # keep models warm between questions (cold load = several seconds)
      OLLAMA_MAX_LOADED_MODELS: "2"   # fast + smart tiers resident together (~7GB RAM)
      OLLAMA_NUM_PARALLEL: "1"        # single-user POC; avoids duplicating KV cache memory
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    # Uncomment to expose Ollama on the host (e.g. to run the eval from the host):
    # ports: ["11434:11434"]

  # One-shot job: pulls the two model tiers into the shared volume, then exits.
  # Idempotent: a second `docker compose up` only checks the manifests.
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      FAST_MODEL: ${FAST_MODEL:-qwen2.5:3b}
      SMART_MODEL: ${SMART_MODEL:-qwen2.5:7b}
    entrypoint: ["/bin/sh", "-c", "ollama pull \"$$FAST_MODEL\" && ollama pull \"$$SMART_MODEL\""]
    restart: "no"

  app:
    build:
      context: .
      args:
        INSTALL_DEV: "false"
    ports:
      - "8000:8000"
    env_file:
      - path: .env          # optional overrides (see .env.example)
        required: false
    environment:
      OLLAMA_HOST: ${OLLAMA_HOST:-http://ollama:11434}
      FAST_MODEL: ${FAST_MODEL:-qwen2.5:3b}
      SMART_MODEL: ${SMART_MODEL:-qwen2.5:7b}
      DB_PATH: /app/var/oncochat.db
    volumes:
      - app_data:/app/var
    depends_on:
      ollama-init:
        condition: service_completed_successfully

volumes:
  ollama_models:
  app_data:
